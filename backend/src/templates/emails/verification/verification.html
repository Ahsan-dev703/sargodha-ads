<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Your Email - Sargodha Ads</title>
    <style>
      {{CSS}}
    </style>
  </head>

  <body>
    <div class="email-shell">
      <div class="email-card">
        <div class="brand-wrap">
          <table
            role="presentation"
            border="0"
            cellpadding="0"
            cellspacing="0"
            align="center"
            style="margin: 0 auto"
          >
            <tr>
              <td align="center" valign="middle">
                <span class="brand-mark">S</span>
              </td>
              <td align="center" valign="middle">
                <span class="brand-name">Sargodha Ads</span>
              </td>
            </tr>
          </table>
        </div>

        <div class="content">
          <p class="eyebrow">Account activation</p>
          <h1>Verify Your Email</h1>

          <p class="greeting">Hello <strong>{{NAME}}</strong>,</p>

          <p class="message">
            Thanks for joining Sargodha Ads. Please verify your email address to
            activate your account and get started.
          </p>

          <!-- Email-Safe Centered Button -->
          <table
            role="presentation"
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            class="button-wrapper"
          >
            <tr>
              <td align="center" style="padding: 10px 0">
                <table
                  role="presentation"
                  border="0"
                  cellpadding="0"
                  cellspacing="0"
                >
                  <tr>
                    <td
                      align="center"
                      bgcolor="#16a34a"
                      style="border-radius: 10px"
                    >
                      <a
                        href="{{VERIFICATION_URL}}"
                        class="verify-button"
                        target="_blank"
                      >
                        Verify Email
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>

          <p class="expiry">
            This link expires in <strong>15 minutes</strong>.
          </p>

          <p class="security">
            If you didn't create this account, you can safely ignore this email.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
